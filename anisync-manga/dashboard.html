<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's Reading - AniSync Dashboard</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .dashboard-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .dashboard-header h1 {
      font-family: var(--font-comic);
      font-size: 3rem;
      margin-bottom: 10px;
    }
    
    .dashboard-header p {
      font-family: var(--font-japanese);
      color: var(--color-gray-light);
      font-size: 1.1rem;
    }
    
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }
    
    .room-card {
      background: var(--color-white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .room-card:hover {
      transform: translate(-4px, -4px);
      box-shadow: var(--shadow-hover);
    }
    
    .room-cover {
      aspect-ratio: 16/9;
      position: relative;
      background: var(--color-gray-dark);
      overflow: hidden;
    }
    
    .room-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .room-status {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.8);
      padding: 5px 12px;
      border-radius: 20px;
      color: white;
      font-family: var(--font-japanese);
      font-size: 0.85rem;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00c853;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .room-info {
      padding: 20px;
    }
    
    .room-title {
      font-family: var(--font-comic);
      font-size: 1.3rem;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    
    .room-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-family: var(--font-japanese);
      font-size: 0.9rem;
      color: var(--color-gray-light);
    }
    
    .room-host {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .host-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
    }
    
    .viewers-count {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--color-accent);
      font-weight: bold;
    }
    
    .join-btn {
      width: 100%;
      padding: 12px;
      font-family: var(--font-comic);
      font-size: 1.1rem;
      background: var(--color-black);
      color: var(--color-white);
      border: var(--border-thin);
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    
    .join-btn:hover {
      background: var(--color-accent);
      transform: translate(-2px, -2px);
    }
    
    .no-rooms {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
    }
    
    .no-rooms-icon {
      font-size: 5rem;
      margin-bottom: 20px;
    }
    
    .no-rooms h2 {
      font-family: var(--font-comic);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .no-rooms p {
      font-family: var(--font-japanese);
      color: var(--color-gray-light);
      margin-bottom: 30px;
    }
    
    .create-first-room {
      display: inline-block;
      padding: 15px 40px;
      font-family: var(--font-comic);
      font-size: 1.3rem;
      background: var(--color-accent);
      color: var(--color-white);
      border: var(--border-thick);
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 6px 6px 0 var(--color-black);
      transition: all 0.2s ease;
    }
    
    .create-first-room:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--color-black);
    }
    
    .refresh-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--color-accent);
      color: var(--color-white);
      border: var(--border-thick);
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--color-black);
      transition: all 0.2s ease;
      z-index: 1000;
    }
    
    .refresh-btn:hover {
      transform: rotate(180deg) scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="manga-header">
    <div class="header-panel">
      <div class="logo">
        <h1>AniSync<span class="sparkle">✨</span></h1>
        <p class="tagline">Read Anime Like Manga!</p>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-item">📖 Home</a>
        <a href="dashboard.html" class="nav-item active">👥 Who's Reading</a>
      </nav>
    </div>
  </header>

  <!-- Dashboard -->
  <main class="dashboard-container">
    <div class="dashboard-header">
      <h1>👥 Who's Reading?</h1>
      <p>Join other manga lovers in watch-together rooms!</p>
    </div>
    
    <div class="rooms-grid" id="rooms-grid">
      <!-- Rooms will be loaded here -->
      <div class="room-card skeleton">
        <div class="room-cover skeleton-loading"></div>
        <div class="room-info">
          <div class="room-title skeleton-loading" style="height: 30px; margin-bottom: 15px;"></div>
          <div class="room-meta skeleton-loading" style="height: 20px;"></div>
        </div>
      </div>
      <div class="room-card skeleton">
        <div class="room-cover skeleton-loading"></div>
        <div class="room-info">
          <div class="room-title skeleton-loading" style="height: 30px; margin-bottom: 15px;"></div>
          <div class="room-meta skeleton-loading" style="height: 20px;"></div>
        </div>
      </div>
      <div class="room-card skeleton">
        <div class="room-cover skeleton-loading"></div>
        <div class="room-info">
          <div class="room-title skeleton-loading" style="height: 30px; margin-bottom: 15px;"></div>
          <div class="room-meta skeleton-loading" style="height: 20px;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Refresh Button -->
  <button class="refresh-btn" id="refresh-btn" title="Refresh Rooms">🔄</button>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
