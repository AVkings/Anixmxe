<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - AniSync</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <!-- HLS.js for .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
  
  <style>
    /* Watch Page Specific Styles */
    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      min-height: calc(100vh - 200px);
    }
    
    .player-section {
      background: var(--color-black);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
    }
    
    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    
    .player-container iframe,
    .player-container video {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .player-container:hover .custom-controls {
      opacity: 1;
    }
    
    .control-btn {
      background: var(--color-white);
      border: 2px solid var(--color-black);
      color: var(--color-black);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    .control-btn:hover {
      background: var(--color-accent);
      color: var(--color-white);
      transform: scale(1.1);
    }
    
    .progress-container {
      flex: 1;
      height: 8px;
      background: var(--color-gray-pale);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: var(--color-accent);
      width: 0%;
      transition: width 0.1s ease;
    }
    
    .time-display {
      color: var(--color-white);
      font-family: var(--font-japanese);
      font-size: 0.9rem;
      min-width: 100px;
    }
    
    .episode-selector {
      background: var(--color-white);
      border: var(--border-thin);
      padding: 10px 15px;
      font-family: var(--font-japanese);
      font-size: 1rem;
      cursor: pointer;
    }
    
    .info-section {
      padding: 20px;
      background: var(--color-white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      margin-top: 20px;
    }
    
    .anime-title {
      font-family: var(--font-comic);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .anime-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-family: var(--font-japanese);
      color: var(--color-gray-light);
    }
    
    .anime-synopsis {
      font-family: var(--font-body);
      line-height: 1.8;
      color: var(--color-gray-mid);
    }
    
    .chat-section {
      background: var(--color-white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-header {
      padding: 15px;
      background: var(--color-black);
      color: var(--color-white);
      font-family: var(--font-comic);
      font-size: 1.3rem;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .chat-message {
      background: var(--color-paper);
      border: var(--border-thin);
      padding: 10px 15px;
      border-radius: 8px;
      animation: chatSlide 0.3s ease-out;
    }
    
    .chat-message .sender {
      font-family: var(--font-comic);
      font-size: 0.9rem;
      color: var(--color-accent);
      margin-bottom: 5px;
    }
    
    .chat-message .text {
      font-family: var(--font-body);
      font-size: 0.95rem;
    }
    
    .chat-input-area {
      padding: 15px;
      border-top: var(--border-thin);
      display: flex;
      gap: 10px;
    }
    
    .chat-input {
      flex: 1;
      padding: 10px;
      border: var(--border-thin);
      font-family: var(--font-body);
      font-size: 1rem;
    }
    
    .emoji-btn {
      width: 44px;
      height: 44px;
      border: var(--border-thin);
      background: var(--color-paper);
      cursor: pointer;
      font-size: 1.3rem;
      border-radius: 8px;
    }
    
    .send-btn {
      width: 44px;
      height: 44px;
      border: var(--border-thin);
      background: var(--color-accent);
      color: var(--color-white);
      cursor: pointer;
      font-size: 1.2rem;
      border-radius: 8px;
    }
    
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .room-actions {
      margin-top: 20px;
      padding-top: 20px;
      border-top: var(--border-thin);
    }
    
    @media (max-width: 1000px) {
      .watch-layout {
        grid-template-columns: 1fr;
      }
      
      .chat-section {
        max-height: 400px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="manga-header">
    <div class="header-panel">
      <div class="logo">
        <h1>AniSync<span class="sparkle">✨</span></h1>
        <p class="tagline">Read Anime Like Manga!</p>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-item">📖 Home</a>
        <a href="dashboard.html" class="nav-item">👥 Who's Reading</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="watch-layout">
    <!-- Player Section -->
    <section class="player-section">
      <div class="player-container" id="player-container">
        <!-- Player wrapper where iframe will be injected -->
        <div id="player-wrapper" style="width:100%;height:100%;"></div>
        
        <!-- Loading fallback -->
        <div id="player-loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:white;font-family:var(--font-comic);font-size:1.2rem;background:#000;">
          <div class="loading-spinner">
            <span>📖 Loading Episode...</span>
          </div>
        </div>
      </div>
      
      <!-- Info Section -->
      <div class="info-section">
        <h1 class="anime-title" id="anime-title">Loading...</h1>
        <div class="anime-meta" id="anime-meta">
          <!-- Metadata will be loaded here -->
        </div>
        <p class="anime-synopsis" id="anime-synopsis">
          <!-- Synopsis will be loaded here -->
        </p>
        
        <div class="action-buttons">
          <button class="btn-manga" id="create-room-btn">🎬 Create Watch Room</button>
          <button class="btn-secondary" id="join-room-btn">👥 Join Room</button>
        </div>
        
        <div class="room-actions">
          <label style="font-family:var(--font-japanese);display:block;margin-bottom:10px;">
            Select Episode:
          </label>
          <select class="episode-selector" id="episode-select">
            <option value="1">Episode 1</option>
          </select>
        </div>
      </div>
    </section>
    
    <!-- Chat Section -->
    <aside class="chat-section">
      <div class="chat-header">
        💬 Reader Chat
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message">
          <div class="sender">System</div>
          <div class="text">Welcome to the chat! Be nice and enjoy the anime! 📚✨</div>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chat-input" placeholder="Type a message...">
        <button class="emoji-btn" id="emoji-btn">😀</button>
        <button class="send-btn" id="send-btn">➤</button>
      </div>
    </aside>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
